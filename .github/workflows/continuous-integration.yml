name: Continuous Integration

on:
  push:
    paths-ignore:
      - "docs/**"
    branches: [main]
  pull_request:
    paths-ignore:
      - "docs/**"
    branches:
      - "**"

jobs:
  Pre-commit-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Linting
        run: |
          pip install pre-commit
          pre-commit run --all-files

  Testing:
    needs: pre-commit-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version:
          - "3.9"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-python: true
          python-version: ${{ matrix.python-version }}

      - name: Installation
        run: uv sync

      - name: Create NETRC file
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CANFAR_NETRC: ${{ secrets.CANFAR_NETRC }}
        run: |
          umask 077
          test -n "$CANFAR_NETRC"
          printf '%s\n' "$CANFAR_NETRC" > "$RUNNER_TEMP/CANFAR_NETRC"

      - name: Obtain CADC certificate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          umask 077
          mkdir -p "$HOME/.ssl"
          uv run --no-sync cadc-get-cert --netrc-file "$RUNNER_TEMP/CANFAR_NETRC" --days-valid 1 --cert-filename "$HOME/.ssl/cadcproxy.pem"
          test -s "$HOME/.ssl/cadcproxy.pem"
          openssl x509 -in "$HOME/.ssl/cadcproxy.pem" -noout -checkend 0

      - name: Run tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          uv run --no-sync pytest tests/ --cov . --cov-report=lcov --cov-report=xml

      - name: Run tests without CADC credentials
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          uv run --no-sync pytest tests/ -m "not cadc" --cov . --cov-report=lcov --cov-report=xml

      - name: Remove NETRC file and CADC certificate
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          rm -f -- "$RUNNER_TEMP/CANFAR_NETRC" "$HOME/.ssl/cadcproxy.pem"

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: "coverage.lcov"
          fail-on-error: false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
