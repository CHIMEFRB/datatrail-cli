name: Continuous Integration

permissions:
  contents: read

on:
  push:
    paths-ignore:
      - "docs/**"
    branches: [main]
  pull_request:
    paths-ignore:
      - "docs/**"
    branches:
      - "**"

jobs:
  Pre-commit-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.13

      - name: Linting
        run: |
          pip install pre-commit
          pre-commit run --all-files

  Testing:
    needs: pre-commit-checks
    runs-on: ubuntu-latest
    env:
      RUN_CADC_TESTS: ${{ github.repository == 'CHIMEFRB/datatrail-cli' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-python: true
          python-version: ${{ matrix.python-version }}

      - name: Installation
        run: uv sync --locked

      - name: Create NETRC file
        if: env.RUN_CADC_TESTS == 'true'
        env:
          CANFAR_NETRC: ${{ secrets.CANFAR_NETRC }}
        run: |
          umask 077
          test -n "$CANFAR_NETRC"
          printf '%s\n' "$CANFAR_NETRC" > "$RUNNER_TEMP/CANFAR_NETRC"

      - name: Obtain CADC certificate
        if: env.RUN_CADC_TESTS == 'true'
        run: |
          umask 077
          mkdir -p "$HOME/.ssl"
          uv run --no-sync cadc-get-cert --netrc-file "$RUNNER_TEMP/CANFAR_NETRC" --days-valid 1 --cert-filename "$HOME/.ssl/cadcproxy.pem"
          test -s "$HOME/.ssl/cadcproxy.pem"
          openssl x509 -in "$HOME/.ssl/cadcproxy.pem" -noout -checkend 0

      - name: Run tests
        if: env.RUN_CADC_TESTS == 'true'
        run: |
          uv run --no-sync pytest tests/ --cov . --cov-report=lcov --cov-report=xml

      - name: Run tests without CADC credentials
        if: env.RUN_CADC_TESTS != 'true'
        run: |
          uv run --no-sync pytest tests/ -m "not cadc" --cov . --cov-report=lcov --cov-report=xml

      - name: Remove NETRC file and CADC certificate
        if: ${{ always() && env.RUN_CADC_TESTS == 'true' }}
        run: |
          rm -f -- "$RUNNER_TEMP/CANFAR_NETRC" "$HOME/.ssl/cadcproxy.pem"

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: "coverage.lcov"
          fail-on-error: false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
